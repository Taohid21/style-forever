<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Control Console | Style Forever</title>

  <!-- Favicon -->
  <link rel="icon" type="image/jpeg" href="https://res.cloudinary.com/dwgvvzbvn/image/upload/v1788708839/b5fnlbs8a19t3hutx5wd.jpg">

  <!-- Font -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

  <!-- Tailwind & Lucide -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>

  <!-- Firebase SDK (যেকোনো ডিভাইস থেকে লাইভ পাসওয়ার্ড সিঙ্ক করার জন্য) -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

  <!-- EmailJS SDK -->
  <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>

  <script>
    // ৫ ঘণ্টার সেশন ভ্যালিডেশন চেক
    const SESSION_DURATION = 5 * 60 * 60 * 1000;
    const sessionTime = localStorage.getItem('sf_admin_session_time');
    const sessionActive = localStorage.getItem('sf_admin_session');

    if (sessionActive === 'active' && sessionTime) {
      if (Date.now() - Number(sessionTime) < SESSION_DURATION) {
        window.location.replace('cpanel.html');
      } else {
        localStorage.removeItem('sf_admin_session');
        localStorage.removeItem('sf_admin_session_time');
      }
    }
  </script>

  <style>
    body {
      font-family: 'Inter', sans-serif;
      background-color: #ffffff;
      color: #0f172a;
    }
    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      20%, 60% { transform: translateX(-6px); }
      40%, 80% { transform: translateX(6px); }
    }
    .shake-anim {
      animation: shake 0.35s ease-in-out;
    }
  </style>
</head>
<body class="bg-white min-h-screen flex flex-col justify-between antialiased selection:bg-black selection:text-white">

  <!-- Responsive Layout -->
  <div class="flex-1 flex items-center justify-center p-4 sm:p-8 lg:p-12">
    <div class="w-full max-w-5xl grid grid-cols-1 lg:grid-cols-2 gap-8 lg:gap-16 items-center">
      
      <!-- বাম পাশ: লটি অ্যানিমেশন (পিসির জন্য) -->
      <div class="hidden lg:flex flex-col items-center justify-center p-8 bg-slate-50 border border-slate-100 rounded-[32px]">
        <img 
          src="https://assets-v2.lottiefiles.com/a/59ae3046-117b-11ee-88a7-ef3838e9662f/r8HuxylbzH.gif" 
          alt="Security Animation" 
          class="w-full max-w-sm h-auto object-contain pointer-events-none select-none"
        >
        <div class="text-center mt-4">
          <p class="text-xs font-semibold text-slate-500">Secured & Powered by <span class="font-bold text-black">tioDisk</span></p>
        </div>
      </div>

      <!-- ডান পাশ: মিনিমাল লগইন কার্ড -->
      <div id="loginWrapper" class="w-full max-w-sm mx-auto space-y-6 transition-all duration-300">
        
        <!-- লোগো ও ব্র্যান্ড -->
        <div class="flex flex-col items-center text-center space-y-3">
          <img 
            src="https://res.cloudinary.com/dwgvvzbvn/image/upload/v1788708839/b5fnlbs8a19t3hutx5wd.jpg" 
            alt="Logo" 
            class="w-16 h-16 rounded-2xl object-cover shadow-sm border border-slate-100"
          >
          <div>
            <h1 class="text-xl font-black tracking-tight text-slate-900">Style Forever</h1>
            <p id="viewSubtitle" class="text-[11px] font-bold text-slate-400 uppercase tracking-widest mt-0.5">Control Panel</p>
          </div>
        </div>

        <!-- ================= ১. লগইন ফর্ম ================= -->
        <div id="loginView">
          <form id="loginForm" onsubmit="handleLogin(event)" class="space-y-4">
            
            <div id="successMessage" class="hidden text-center text-xs font-bold text-emerald-700 bg-emerald-50 border border-emerald-200 py-2.5 px-4 rounded-2xl"></div>
            <div id="errorMessage" class="hidden text-center text-xs font-bold text-rose-600 bg-rose-50 border border-rose-100 py-2.5 px-4 rounded-2xl">
              Invalid credentials
            </div>

            <!-- Username -->
            <div class="space-y-1.5">
              <label class="block text-xs font-bold text-slate-800" for="username">Username</label>
              <input 
                type="text" 
                id="username" 
                required
                autocomplete="off"
                class="w-full bg-slate-50 hover:bg-slate-100/70 focus:bg-white border border-slate-200 focus:border-black rounded-2xl px-4 py-3 text-sm font-semibold text-slate-900 outline-none transition"
              >
            </div>

            <!-- Password -->
            <div class="space-y-1.5">
              <div class="flex items-center justify-between">
                <label class="block text-xs font-bold text-slate-800" for="password">Password</label>
                <button 
                  type="button" 
                  onclick="showForgotView()" 
                  class="text-[11px] font-bold text-slate-400 hover:text-black transition"
                >
                  Forgot?
                </button>
              </div>
              <div class="relative flex items-center">
                <input 
                  type="password" 
                  id="password" 
                  required
                  class="w-full bg-slate-50 hover:bg-slate-100/70 focus:bg-white border border-slate-200 focus:border-black rounded-2xl pl-4 pr-11 py-3 text-sm font-semibold text-slate-900 outline-none transition"
                >
                <button 
                  type="button" 
                  onclick="togglePasswordVisibility('password', 'eyeIconLogin')" 
                  tabindex="-1"
                  class="absolute right-3.5 text-slate-400 hover:text-black p-1 transition"
                >
                  <i data-lucide="eye" id="eyeIconLogin" class="w-4 h-4"></i>
                </button>
              </div>
            </div>

            <!-- Submit Button -->
            <div class="pt-2">
              <button 
                type="submit" 
                id="submitBtn" 
                class="w-full bg-black hover:bg-neutral-800 active:scale-[0.98] text-white py-3.5 rounded-2xl text-xs font-bold tracking-wide transition-all shadow-sm flex items-center justify-center gap-2"
              >
                <span id="btnText">Log In</span>
                <div id="btnSpinner" class="hidden w-4 h-4 border-2 border-white border-t-transparent rounded-full animate-spin"></div>
              </button>
            </div>

          </form>
        </div>

        <!-- ================= ২. OTP ভেরিফিকেশন ও পাসওয়ার্ড রিসেট ================= -->
        <div id="forgotView" class="hidden">
          
          <!-- স্টেপ ১: OTP পাঠানো -->
          <div id="otpRequestStep" class="space-y-4">
            <div class="text-center pb-1">
              <h3 class="text-sm font-extrabold text-slate-900">Security Verification</h3>
              <p class="text-[11px] text-slate-400 font-medium">OTP will be sent to admin email</p>
            </div>

            <div id="otpSendError" class="hidden text-center text-xs font-bold text-rose-600 bg-rose-50 border border-rose-100 py-2.5 px-4 rounded-2xl"></div>

            <div class="space-y-1.5">
              <label class="block text-xs font-bold text-slate-800">Admin Email</label>
              <input 
                type="email" 
                id="adminEmailInput" 
                value="torikul9047@gmail.com" 
                readonly
                class="w-full bg-slate-100 text-slate-600 border border-slate-200 rounded-2xl px-4 py-3 text-sm font-semibold outline-none cursor-not-allowed select-none"
              >
            </div>

            <div class="pt-1 space-y-2">
              <button 
                type="button" 
                id="sendOtpBtn"
                onclick="sendEmailOtp()" 
                class="w-full bg-black hover:bg-neutral-800 active:scale-[0.98] text-white py-3.5 rounded-2xl text-xs font-bold tracking-wide transition shadow-sm flex items-center justify-center gap-2"
              >
                <span id="sendOtpText">Send Verification Code</span>
                <div id="otpSpinner" class="hidden w-4 h-4 border-2 border-white border-t-transparent rounded-full animate-spin"></div>
              </button>

              <button 
                type="button" 
                onclick="showLoginView()" 
                class="w-full bg-slate-100 hover:bg-slate-200 text-slate-700 py-3 rounded-2xl text-xs font-bold tracking-wide transition"
              >
                Cancel
              </button>
            </div>
          </div>

          <!-- স্টেপ ২: কোড মিলিয়ে নতুন পাসওয়ার্ড সেট -->
          <div id="otpVerifyStep" class="hidden">
            <form onsubmit="handleVerifyAndReset(event)" class="space-y-3.5">
              <div class="text-center pb-1">
                <h3 class="text-sm font-extrabold text-slate-900">Enter Code & Reset</h3>
                <p class="text-[11px] text-emerald-600 font-medium">Code sent to your email</p>
              </div>

              <div id="verifyError" class="hidden text-center text-xs font-bold text-rose-600 bg-rose-50 border border-rose-100 py-2.5 px-4 rounded-2xl"></div>

              <!-- OTP কোড ইনপুট -->
              <div class="space-y-1">
                <label class="block text-xs font-bold text-slate-800">6-Digit Code</label>
                <input 
                  type="text" 
                  id="otpCodeInput" 
                  required 
                  maxlength="6"
                  class="w-full bg-slate-50 focus:bg-white border border-slate-200 focus:border-black rounded-2xl px-4 py-3 text-center text-lg tracking-widest font-mono font-bold text-slate-900 outline-none"
                >
              </div>

              <!-- নতুন পাসওয়ার্ড ইনপুট -->
              <div class="space-y-1">
                <label class="block text-xs font-bold text-slate-800">New Password</label>
                <input 
                  type="password" 
                  id="newPassInput" 
                  required 
                  class="w-full bg-slate-50 focus:bg-white border border-slate-200 focus:border-black rounded-2xl px-4 py-3 text-sm font-semibold text-slate-900 outline-none"
                >
              </div>

              <div class="pt-2 space-y-2">
                <button 
                  type="submit" 
                  id="savePassBtn"
                  class="w-full bg-black hover:bg-neutral-800 active:scale-[0.98] text-white py-3.5 rounded-2xl text-xs font-bold tracking-wide transition shadow-sm"
                >
                  Set New Password
                </button>

                <button 
                  type="button" 
                  onclick="showLoginView()" 
                  class="w-full bg-slate-100 hover:bg-slate-200 text-slate-700 py-3 rounded-2xl text-xs font-bold tracking-wide transition"
                >
                  Back to Login
                </button>
              </div>
            </form>
          </div>

        </div>

      </div>

    </div>
  </div>

  <!-- tioDisk Official Footer -->
  <footer class="py-6 text-center text-slate-400 text-xs font-medium">
    &copy; Style Forever • Powered by <a href="https://tiodisk.top" target="_blank" class="font-bold text-slate-700 hover:text-black transition">tioDisk</a>
  </footer>

  <script>
    // আপনার দেওয়া আসল EmailJS Credentials
    const EMAILJS_PUBLIC_KEY = "ppl210i9r_ccGVUkq";
    const EMAILJS_SERVICE_ID = "service_ymk6s7e";
    const EMAILJS_TEMPLATE_ID = "template_m9gbykx";

    if (window.emailjs) {
      emailjs.init(EMAILJS_PUBLIC_KEY);
    }

    // ফায়ারবেজ সেন্ট্রাল ডাটাবেজ কনফিগারেশন (বিশ্বের যেকোনো প্রান্ত থেকে পাসওয়ার্ড সিঙ্ক রাখার জন্য)
    const firebaseConfig = {
      apiKey: "AIzaSyD_HBGuQSh_GzqrHqHbgdaoBikLZsK3Qqs",
      authDomain: "new-all-f99f7.firebaseapp.com",
      databaseURL: "https://new-all-f99f7-default-rtdb.firebaseio.com",
      projectId: "new-all-f99f7",
      storageBucket: "new-all-f99f7.firebasestorage.app",
      messagingSenderId: "1069748173900",
      appId: "1:1069748173900:web:158d6336c0f4628133c8e9"
    };

    if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
    const db = firebase.database();
    const AUTH_PATH = 'stores/styleforever/adminAuth';

    // সেন্ট্রাল অথেনটিকেশন ডাটাবেজ লিসেনার
    let activeAuth = {
      username: "styleforever",
      password: "style890"
    };

    db.ref(AUTH_PATH).on('value', snap => {
      const data = snap.val();
      if (data && data.username && data.password) {
        activeAuth = data;
      } else {
        // ডাটাবেজে প্রথমবার ইনিশিয়ালাইজেশন
        db.ref(AUTH_PATH).set(activeAuth);
      }
    });

    let generatedOtp = null;
    let otpExpiresAt = null;

    function togglePasswordVisibility(inputId, iconId) {
      const input = document.getElementById(inputId);
      const icon = document.getElementById(iconId);
      if (!input || !icon) return;

      if (input.type === 'password') {
        input.type = 'text';
        icon.setAttribute('data-lucide', 'eye-off');
      } else {
        input.type = 'password';
        icon.setAttribute('data-lucide', 'eye');
      }
      lucide.createIcons();
    }

    function showForgotView() {
      document.getElementById('loginView').classList.add('hidden');
      document.getElementById('forgotView').classList.remove('hidden');
      document.getElementById('otpRequestStep').classList.remove('hidden');
      document.getElementById('otpVerifyStep').classList.add('hidden');
      document.getElementById('viewSubtitle').innerText = "Security Recovery";
      document.getElementById('otpSendError').classList.add('hidden');
    }

    function showLoginView() {
      document.getElementById('forgotView').classList.add('hidden');
      document.getElementById('loginView').classList.remove('hidden');
      document.getElementById('viewSubtitle').innerText = "Control Panel";
      document.getElementById('errorMessage').classList.add('hidden');
    }

    // ১. সেন্ট্রাল ক্লাউড অথেনটিকেশন লগইন
    function handleLogin(e) {
      e.preventDefault();

      const user = document.getElementById('username').value.trim();
      const pass = document.getElementById('password').value.trim();
      const submitBtn = document.getElementById('submitBtn');
      const btnText = document.getElementById('btnText');
      const btnSpinner = document.getElementById('btnSpinner');
      const errorMsg = document.getElementById('errorMessage');
      const successMsg = document.getElementById('successMessage');
      const wrapper = document.getElementById('loginWrapper');

      errorMsg.classList.add('hidden');
      successMsg.classList.add('hidden');
      wrapper.classList.remove('shake-anim');

      btnText.innerText = "Verifying...";
      btnSpinner.classList.remove('hidden');
      submitBtn.disabled = true;

      // ফায়ারবেজ থেকে লাইভ ফ্রেশ পাসওয়ার্ড ভেরিফিকেশন
      db.ref(AUTH_PATH).once('value').then(snap => {
        const liveCreds = snap.val() || activeAuth;

        if (user === liveCreds.username && pass === liveCreds.password) {
          localStorage.setItem('sf_admin_session', 'active');
          localStorage.setItem('sf_admin_session_time', Date.now().toString());

          btnText.innerText = "Success";
          btnSpinner.classList.add('hidden');
          submitBtn.classList.remove('bg-black', 'hover:bg-neutral-800');
          submitBtn.classList.add('bg-emerald-600');

          wrapper.style.opacity = '0';
          wrapper.style.transform = 'scale(0.96)';

          setTimeout(() => {
            window.location.replace('cpanel.html');
          }, 350);
        } else {
          btnText.innerText = "Log In";
          btnSpinner.classList.add('hidden');
          submitBtn.disabled = false;

          errorMsg.classList.remove('hidden');
          wrapper.classList.add('shake-anim');
        }
      }).catch(() => {
        btnText.innerText = "Log In";
        btnSpinner.classList.add('hidden');
        submitBtn.disabled = false;
        errorMsg.classList.remove('hidden');
      });
    }

    // ২. ইমেইলে OTP পাঠানো
    async function sendEmailOtp() {
      const email = document.getElementById('adminEmailInput').value;
      const sendBtn = document.getElementById('sendOtpBtn');
      const sendText = document.getElementById('sendOtpText');
      const spinner = document.getElementById('otpSpinner');
      const errBox = document.getElementById('otpSendError');

      errBox.classList.add('hidden');
      sendText.innerText = "Sending Code...";
      spinner.classList.remove('hidden');
      sendBtn.disabled = true;

      generatedOtp = Math.floor(100000 + Math.random() * 900000).toString();
      otpExpiresAt = Date.now() + (10 * 60 * 1000);

      try {
        await emailjs.send(EMAILJS_SERVICE_ID, EMAILJS_TEMPLATE_ID, {
          to_email: email,
          otp_code: generatedOtp
        });

        document.getElementById('otpRequestStep').classList.add('hidden');
        document.getElementById('otpVerifyStep').classList.remove('hidden');
      } catch (err) {
        console.error("Email send failed:", err);
        errBox.innerText = "Failed to send code. Please try again.";
        errBox.classList.remove('hidden');
      } finally {
        sendText.innerText = "Send Verification Code";
        spinner.classList.add('hidden');
        sendBtn.disabled = false;
      }
    }

    // ৩. OTP যাচাই এবং ক্লাউড ডাটাবেজে স্থায়ীভাবে পাসওয়ার্ড আপডেট
    async function handleVerifyAndReset(e) {
      e.preventDefault();

      const userOtp = document.getElementById('otpCodeInput').value.trim();
      const newPass = document.getElementById('newPassInput').value.trim();
      const errBox = document.getElementById('verifyError');
      const saveBtn = document.getElementById('savePassBtn');
      const wrapper = document.getElementById('loginWrapper');

      errBox.classList.add('hidden');
      wrapper.classList.remove('shake-anim');

      if (Date.now() > otpExpiresAt) {
        errBox.innerText = "OTP has expired! Request a new one.";
        errBox.classList.remove('hidden');
        return;
      }

      if (userOtp !== generatedOtp) {
        errBox.innerText = "Incorrect code!";
        errBox.classList.remove('hidden');
        wrapper.classList.add('shake-anim');
        return;
      }

      if (newPass.length < 4) {
        errBox.innerText = "Password must be at least 4 characters.";
        errBox.classList.remove('hidden');
        wrapper.classList.add('shake-anim');
        return;
      }

      saveBtn.innerText = "Saving to Server...";
      saveBtn.disabled = true;

      try {
        // ফায়ারবেজে স্থায়ীভাবে সেভ (যাতে যেকোনো পিসি/মোবাইল থেকেই এই নতুন পাসওয়ার্ড দিয়েই ঢুকতে হয়)
        await db.ref(AUTH_PATH).update({
          password: newPass,
          updatedAt: Date.now()
        });

        localStorage.removeItem('sf_admin_session');
        localStorage.removeItem('sf_admin_session_time');

        showLoginView();

        const successMsg = document.getElementById('successMessage');
        successMsg.innerText = "Password reset globally! Log in with new password.";
        successMsg.classList.remove('hidden');

        document.getElementById('password').value = '';
      } catch (err) {
        errBox.innerText = "Failed to update server password.";
        errBox.classList.remove('hidden');
      } finally {
        saveBtn.innerText = "Set New Password";
        saveBtn.disabled = false;
      }
    }

    document.addEventListener('DOMContentLoaded', () => {
      lucide.createIcons();
    });
  </script>
</body>
</html>
