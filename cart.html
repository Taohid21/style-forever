<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title id="cartPageTitle">Shopping Cart | Style Forever</title>
  
  <link id="pageFavicon" rel="icon" type="image/jpeg" href="https://res.cloudinary.com/dwgvvzbvn/image/upload/v1788708839/b5fnlbs8a19t3hutx5wd.jpg">
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>

  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
  
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Inter"', 'sans-serif'],
          },
          colors: {
            brand: {
              50: '#ecfdf5',
              100: '#d1fae5',
              600: '#059669',
              700: '#047857',
            }
          }
        }
      }
    }
  </script>

  <style>
    body { 
      font-family: 'Inter', sans-serif; 
      background-color: #f8fafc;
      color: #0f172a;
    }
    .custom-scroll::-webkit-scrollbar { width: 4px; }
    .custom-scroll::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 999px; }
  </style>
</head>
<body class="antialiased selection:bg-brand-600 selection:text-white min-h-screen flex flex-col">

  <header class="bg-white/95 backdrop-blur-md border-b border-slate-200 sticky top-0 z-30">
    <div class="max-w-5xl mx-auto px-4 sm:px-6 h-16 flex items-center justify-between">
      <div class="flex items-center gap-3">
        <button onclick="handleBackNavigation()" class="w-9 h-9 rounded-xl border border-slate-200 bg-white flex items-center justify-center text-slate-700 hover:bg-slate-50 transition active:scale-95 shadow-sm">
          <i data-lucide="arrow-left" class="w-4 h-4"></i>
        </button>
        <a id="cartBrandLink" href="index.html" class="flex items-center gap-2.5">
          <img id="cartHeaderLogo" src="https://res.cloudinary.com/dwgvvzbvn/image/upload/v1788708839/b5fnlbs8a19t3hutx5wd.jpg" alt="Logo" class="w-8 h-8 rounded-lg object-cover border border-slate-200">
          <h1 class="text-sm sm:text-base font-black text-slate-900 leading-tight">
            <span id="cartStoreTitle">Shopping Cart</span>
            <span class="text-[10px] px-2 py-0.5 bg-slate-900 text-white rounded-full font-black ml-1" id="cartCountHeader">0</span>
          </h1>
        </a>
      </div>

      <button onclick="clearCart()" class="text-xs font-bold text-slate-400 hover:text-rose-600 transition flex items-center gap-1">
        <i data-lucide="trash-2" class="w-3.5 h-3.5"></i>
        <span class="hidden sm:inline">Empty Cart</span>
      </button>
    </div>
  </header>

  <main class="max-w-5xl mx-auto px-4 sm:px-6 py-6 sm:py-8 flex-1 w-full">
    
    <div id="cartEmptyState" class="hidden text-center py-20 bg-white rounded-2xl border border-slate-200 p-8 shadow-sm max-w-sm mx-auto mt-6">
      <div class="w-14 h-14 bg-slate-50 text-slate-400 rounded-2xl flex items-center justify-center mx-auto mb-3 border border-slate-100">
        <i data-lucide="shopping-bag" class="w-7 h-7 text-slate-400"></i>
      </div>
      <h3 class="text-base font-black text-slate-900 mb-1">আপনার কার্ট খালি আছে</h3>
      <p class="text-xs text-slate-400 mb-6">পছন্দের পণ্য কার্টে যোগ করুন।</p>
      <button onclick="handleBackNavigation()" class="inline-flex items-center gap-2 bg-slate-900 hover:bg-black text-white px-5 py-2.5 rounded-xl text-xs font-bold transition shadow active:scale-95">
        <i data-lucide="arrow-left" class="w-4 h-4"></i>
        <span>কেনাকাটা করুন</span>
      </button>
    </div>

    <div id="cartContent" class="grid grid-cols-1 lg:grid-cols-12 gap-6 items-start">
      <div class="lg:col-span-7 space-y-3" id="cartItemsList"></div>

      <div class="lg:col-span-5 sticky top-24 space-y-4">
        <div class="bg-white p-5 sm:p-6 rounded-2xl border border-slate-200 shadow-sm space-y-4">
          
          <h2 class="text-xs font-black uppercase tracking-wider text-slate-900 border-b border-slate-100 pb-3 flex items-center justify-between">
            <span>অর্ডার বিবরণী</span>
            <span class="text-[11px] text-slate-400 font-bold" id="summaryTotalItems">0 items</span>
          </h2>

          <div class="space-y-2.5 text-xs sm:text-sm">
            <div class="flex justify-between text-slate-600">
              <span>প্রোডাক্ট মূল্য:</span>
              <span class="font-bold text-slate-900" id="subtotalPrice">BDT 0</span>
            </div>
            
            <div class="flex justify-between text-slate-600">
              <span>ডেলিভারি চার্জ:</span>
              <span class="font-bold text-slate-800" id="deliveryFeeNotice">ডাটাবেজ লোড হচ্ছে...</span>
            </div>

            <!-- Database-Synced Advance Notice (Location based or fixed) -->
            <div id="advanceRequiredNoticeWrap" class="hidden bg-amber-50 border border-amber-200 p-3 rounded-xl text-xs font-bold text-amber-900 flex items-center justify-between">
              <span>প্রয়োজনীয় অগ্রিম ফি:</span>
              <span id="advanceNoticeAmount" class="font-black"></span>
            </div>

            <div id="freeDeliveryNoticeWrap" class="hidden bg-brand-50 border border-brand-200 p-2.5 rounded-xl text-xs font-bold text-brand-700 flex items-center gap-1.5">
              <i data-lucide="truck" class="w-4 h-4 text-brand-600"></i>
              <span>ফ্রি ডেলিভারি প্রযোজ্য</span>
            </div>
          </div>

          <div class="border-t border-slate-100 pt-3 flex justify-between items-baseline font-black text-slate-900">
            <span>মোট মূল্য:</span>
            <span class="text-lg text-slate-900" id="grandTotalPrice">BDT 0</span>
          </div>

          <button onclick="proceedToCheckout()" class="w-full bg-brand-600 hover:bg-brand-700 text-white py-3.5 rounded-xl font-bold text-xs sm:text-sm tracking-wide transition active:scale-95 shadow-md flex items-center justify-center gap-2 cursor-pointer">
            <span>অর্ডার সম্পন্ন করুন</span>
            <i data-lucide="arrow-right" class="w-4 h-4"></i>
          </button>

          <button onclick="handleBackNavigation()" class="w-full bg-slate-50 hover:bg-slate-100 text-slate-700 py-2.5 rounded-xl font-bold text-xs transition border border-slate-200">
            আরও কেনাকাটা করুন
          </button>
        </div>
      </div>

    </div>
  </main>

  <script>
    let LOGO_PLACEHOLDER = "https://res.cloudinary.com/dwgvvzbvn/image/upload/v1788708839/b5fnlbs8a19t3hutx5wd.jpg";

    const urlParams = new URLSearchParams(window.location.search);
    const currentShop = urlParams.get('shop') || 'styleforever';
    const CART_STORAGE_KEY = `cart_${currentShop}`;

    const homeShopUrl = `index.html?shop=${encodeURIComponent(currentShop)}`;
    const brandLink = document.getElementById('cartBrandLink');
    if (brandLink) brandLink.href = homeShopUrl;

    function handleBackNavigation() {
      if (document.referrer && window.history.length > 1) {
        window.history.back();
      } else {
        window.location.href = homeShopUrl;
      }
    }

    const firebaseConfig = {
      apiKey: "AIzaSyD_HBGuQSh_GzqrHqHbgdaoBikLZsK3Qqs",
      authDomain: "new-all-f99f7.firebaseapp.com",
      databaseURL: "https://new-all-f99f7-default-rtdb.firebaseio.com",
      projectId: "new-all-f99f7",
      storageBucket: "new-all-f99f7.firebasestorage.app",
      messagingSenderId: "1069748173900",
      appId: "1:1069748173900:web:158d6336c0f4628133c8e9"
    };

    if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    // কোনো হার্ডকোডেড টাকা নেই, ডাটাবেজ থেকে লোড হবে
    let storeSettings = {
      storeName: 'Style Forever',
      delInside: null,
      delOutside: null
    };

    db.ref(`stores/${currentShop}/settings`).on('value', snap => {
      const s = snap.val();
      if (!s) return;

      storeSettings = { 
        ...storeSettings, 
        ...s,
        delInside: s.delInside !== undefined ? Number(s.delInside) : 0,
        delOutside: s.delOutside !== undefined ? Number(s.delOutside) : 0
      };

      const storeName = s.storeName || 'Style Forever';
      document.title = `Cart | ${storeName}`;
      document.getElementById('cartStoreTitle').innerText = `${storeName} Cart`;

      if (s.logo) {
        LOGO_PLACEHOLDER = s.logo;
        document.getElementById('cartHeaderLogo').src = s.logo;
        document.getElementById('pageFavicon').href = s.logo;
      }

      renderCart();
    });

    let cart = [];

    function loadCart() {
      cart = JSON.parse(localStorage.getItem(CART_STORAGE_KEY) || '[]');
      renderCart();
    }

    function renderCart() {
      const emptyState = document.getElementById('cartEmptyState');
      const content = document.getElementById('cartContent');
      const list = document.getElementById('cartItemsList');
      const headerCount = document.getElementById('cartCountHeader');
      const summaryItems = document.getElementById('summaryTotalItems');

      const totalItems = cart.reduce((acc, it) => acc + (Number(it.quantity) || 1), 0);
      if (headerCount) headerCount.innerText = totalItems;
      if (summaryItems) summaryItems.innerText = `${totalItems} items`;

      if (cart.length === 0) {
        emptyState.classList.remove('hidden');
        content.classList.add('hidden');
        lucide.createIcons();
        return;
      }

      emptyState.classList.add('hidden');
      content.classList.remove('hidden');
      list.innerHTML = '';

      let subtotal = 0;
      let allItemsFreeDelivery = cart.length > 0 && cart.every(it => it.isFreeDelivery);

      // ডাটাবেজ অনুযায়ী অ্যাডভান্স ফি যাচাই (যোগ হবে না, একটাই থাকবে)
      const advanceItems = cart.filter(it => it.advanceRequired);
      let advanceDisplayText = '';
      if (advanceItems.length > 0) {
        const maxSpecificAdvance = Math.max(...advanceItems.map(it => Number(it.advanceAmount) || 0));
        if (maxSpecificAdvance > 0) {
          advanceDisplayText = `BDT ${maxSpecificAdvance}`;
        } else if (storeSettings.delInside !== null && storeSettings.delOutside !== null) {
          advanceDisplayText = `ঢাকা ৳${storeSettings.delInside} / বাইরে ৳${storeSettings.delOutside}`;
        } else {
          advanceDisplayText = `চেকআউট লোকেশন অনুযায়ী`;
        }
      }

      cart.forEach((item, index) => {
        const itemPrice = Number(item.price) || 0;
        const itemQty = Number(item.quantity) || 1;
        subtotal += itemPrice * itemQty;

        const el = document.createElement('div');
        el.className = "bg-white p-4 rounded-2xl border border-slate-200 shadow-sm space-y-3";

        el.innerHTML = `
          <div class="flex gap-3.5 items-center">
            <img 
              src="${item.imageUrl || LOGO_PLACEHOLDER}" 
              alt="${item.name}" 
              class="w-16 h-20 sm:w-20 sm:h-24 object-cover rounded-xl border border-slate-200 bg-slate-50 shrink-0"
              onerror="this.src='${LOGO_PLACEHOLDER}'"
            >
            <div class="flex-1 min-w-0">
              <div class="flex justify-between items-start gap-2">
                <h4 class="text-xs sm:text-sm font-bold text-slate-900 truncate">${item.name}</h4>
                <button onclick="removeItem(${index})" class="text-slate-400 hover:text-rose-600 p-1 transition shrink-0">
                  <i data-lucide="trash-2" class="w-4 h-4"></i>
                </button>
              </div>
              
              <div class="flex items-baseline gap-2 mt-0.5">
                <span class="text-xs sm:text-sm font-black text-slate-900">BDT ${itemPrice}</span>
                ${item.regularPrice && item.regularPrice > itemPrice ? `<span class="text-[11px] text-slate-400 line-through">BDT ${item.regularPrice}</span>` : ''}
              </div>
              
              <div class="flex flex-wrap items-center gap-1.5 mt-1.5 text-[11px] text-slate-500 font-medium">
                ${item.selectedSize ? `<span class="bg-slate-100 px-2 py-0.5 rounded-md text-slate-700 font-bold">${item.selectedSize}</span>` : ''}
                ${item.selectedColor ? `<span class="bg-slate-100 px-2 py-0.5 rounded-md text-slate-700 font-bold">${item.selectedColor}</span>` : ''}
              </div>

              <div class="flex items-center justify-between gap-3 mt-3 pt-2 border-t border-slate-100">
                <div class="flex items-center border border-slate-200 rounded-xl bg-slate-50 overflow-hidden">
                  <button onclick="changeQty(${index}, -1)" class="w-7 h-7 flex items-center justify-center font-bold text-xs text-slate-700 hover:bg-slate-200 transition">-</button>
                  <span class="text-xs font-bold w-7 text-center select-none text-slate-900">${itemQty}</span>
                  <button onclick="changeQty(${index}, 1)" class="w-7 h-7 flex items-center justify-center font-bold text-xs text-slate-700 hover:bg-slate-200 transition">+</button>
                </div>
                <span class="text-xs font-black text-slate-900">BDT ${itemPrice * itemQty}</span>
              </div>
            </div>
          </div>
        `;

        list.appendChild(el);
      });

      document.getElementById('subtotalPrice').innerText = `BDT ${subtotal}`;
      document.getElementById('grandTotalPrice').innerText = `BDT ${subtotal}`;

      // ডেলিভারি চার্জ ডাটাবেজ অনুযায়ী
      const freeDelBanner = document.getElementById('freeDeliveryNoticeWrap');
      const delNotice = document.getElementById('deliveryFeeNotice');
      if (allItemsFreeDelivery) {
        freeDelBanner.classList.remove('hidden');
        delNotice.innerHTML = `<span class="text-brand-600 font-bold">Free</span>`;
      } else if (storeSettings.delInside !== null && storeSettings.delOutside !== null) {
        freeDelBanner.classList.add('hidden');
        delNotice.innerText = `ঢাকা ৳${storeSettings.delInside} / বাইরে ৳${storeSettings.delOutside}`;
      }

      // অ্যাডভান্স ফি
      const advBanner = document.getElementById('advanceRequiredNoticeWrap');
      const advAmountEl = document.getElementById('advanceNoticeAmount');
      if (advanceDisplayText) {
        advBanner.classList.remove('hidden');
        advAmountEl.innerText = advanceDisplayText;
      } else {
        advBanner.classList.add('hidden');
      }

      lucide.createIcons();
    }

    function changeQty(index, delta) {
      cart[index].quantity = (Number(cart[index].quantity) || 1) + delta;
      if (cart[index].quantity <= 0) {
        if (confirm('পণ্যটি কার্ট থেকে মুছে ফেলতে চান?')) {
          cart.splice(index, 1);
        } else {
          cart[index].quantity = 1;
        }
      }
      localStorage.setItem(CART_STORAGE_KEY, JSON.stringify(cart));
      renderCart();
    }

    function removeItem(index) {
      cart.splice(index, 1);
      localStorage.setItem(CART_STORAGE_KEY, JSON.stringify(cart));
      renderCart();
    }

    function clearCart() {
      if (confirm('আপনি কি নিশ্চিত যে সম্পূর্ণ কার্ট খালি করতে চান?')) {
        cart = [];
        localStorage.removeItem(CART_STORAGE_KEY);
        renderCart();
      }
    }

    function proceedToCheckout() {
      if (cart.length === 0) return;
      window.location.href = `checkout.html?fromCart=true&shop=${encodeURIComponent(currentShop)}`;
    }

    document.addEventListener('DOMContentLoaded', () => {
      lucide.createIcons();
      loadCart();
    });
  </script>
</body>
</html>
